name: goalrush
description: "Goal Rush — casual penalty quiz arcade."
publish_to: 'none'
version: 1.0.1+3

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # ── existing (white / game side) ──
  shared_preferences: ^2.5.5
  provider: ^6.1.5+1

  # ── gray shell stack ──
  # Minor versions are deliberately staggered vs. the template project
  # (see .cursor/rules/android_gray_guide.md → "Library Versions Reference").
  # flutter_local_notifications is pinned to 19.5.x — the positional-arg
  # API this shell uses is retained; 22.x renamed the first `initialize`
  # arg to keyword form.
  webview_flutter: ^4.13.0
  webview_flutter_android: ^4.11.0
  connectivity_plus: ^6.1.4
  http: ^1.5.0
  url_launcher: ^6.3.1
  device_info_plus: ^11.3.3
  flutter_secure_storage: ^10.2.0
  appsflyer_sdk: ^6.16.2
  firebase_core: ^3.13.1
  firebase_messaging: ^15.2.5
  firebase_app_check: ^0.3.2+10
  flutter_local_notifications: 19.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  image: ^4.5.3

flutter_launcher_icons:
  android: true
  image_path: "assets/gr_stadium_backdrops_v2/icon2.png"
  min_sdk_android: 21
  adaptive_icon_background: "#0A1F3D"
  adaptive_icon_foreground: "assets/gr_stadium_backdrops_v2/icon2_foreground.png"
  adaptive_icon_foreground_inset: 0
  remove_alpha_ios: true

flutter:
  uses-material-design: true

  assets:
    - assets/gr_stadium_backdrops_v2/
    - assets/Goal_Rush_gameplay_assets/
